name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock
      - name: Compile
        run: python -m compileall -q acc tests scripts
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check browser script syntax
        run: node --check acc/static/app.js
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Build zipapp
        run: python scripts/build_zipapp.py
